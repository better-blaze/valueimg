<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>관리자 대시보드 · 실시간 그림 평가</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="page page--dashboard">
    <header class="page__header">
      <h1 class="page__title">관리자 대시보드</h1>
      <p id="pageSubtitle" class="page__subtitle">
        학생들에게 아래 PIN을 알려 주세요.
      </p>
    </header>

    <main class="page__main">
      <div id="lobbyPanel" class="panel">
        <section class="card card--pin" aria-labelledby="pin-heading">
          <span id="pin-heading" class="card__label">세션 PIN</span>
          <p
            id="pinDisplay"
            class="pin-display pin-display--loading"
            aria-live="polite"
          >
            PIN 생성 중…
          </p>
        </section>

        <section class="card" aria-labelledby="users-heading">
          <h2 id="users-heading" class="visually-hidden">접속 현황</h2>
          <p class="stat-line stat-row__text">
            현재 접속자:
            <span id="userCount" class="stat-row__count">0</span>명
          </p>
        </section>

        <section class="card" aria-labelledby="eval-start-heading">
          <h2 id="eval-start-heading" class="card__label">평가 시작</h2>
          <div class="form-group">
            <label for="targetClassInput">평가할 반</label>
            <input
              id="targetClassInput"
              type="text"
              class="input"
              placeholder="예: 6-1, 6-2"
              maxlength="32"
              autocomplete="off"
            />
          </div>
          <button type="button" id="startEvalBtn" class="btn">
            평가 시작
          </button>
          <button type="button" id="resetSessionLobbyBtn" class="btn btn--danger btn--danger-outline">
            세션 종료 및 초기화
          </button>
        </section>
      </div>

      <div id="evalPanel" class="panel panel--hidden" hidden>
        <section class="card card--eval-preview" aria-labelledby="eval-img-heading">
          <h2 id="eval-img-heading" class="card__label">현재 평가 중인 이미지</h2>
          <div class="eval-image-wrap eval-image-wrap--with-status">
            <p
              id="adminEvalImageStatus"
              class="eval-image-status"
              hidden
              aria-live="polite"
            ></p>
            <img
              id="adminEvalImage"
              class="eval-image"
              src=""
              alt="평가 중인 작품"
            />
          </div>
          <div class="eval-preview-actions">
            <p
              id="adminSubmitStatus"
              class="eval-submit-stat"
              aria-live="polite"
            >
              0명 제출 / 전체 0명
            </p>
            <div class="eval-preview-actions__buttons">
              <button type="button" id="forceNextImageBtn" class="btn btn--secondary">
                다음 이미지로 강제 이동
              </button>
              <button type="button" id="resetSessionEvalBtn" class="btn btn--danger">
                세션 종료 및 초기화
              </button>
            </div>
          </div>
        </section>
      </div>

      <section id="scoresActionsSection" class="card card--scores-actions">
        <h2 class="card__label">평가 결과 (누적)</h2>
        <p class="scores-actions-hint">
          입력한 반 이름 또는 진행 중인 세션의 반 기준으로 저장된 누적 평점이
          있으면 버튼이 활성화됩니다.
        </p>
        <button
          type="button"
          id="showScoresBtn"
          class="btn btn--scores"
          disabled
        >
          평점 보기
        </button>
      </section>

      <section id="scoresResultCard" class="card card--scores-result" hidden>
        <h2 id="scoresResultHeading" class="card__label">평점 순위</h2>
        <ul id="scoresRankingList" class="ranking-list"></ul>
        <button type="button" id="downloadCsvBtn" class="btn btn--secondary" disabled>
          결과 엑셀로 다운로드
        </button>
        <button
          type="button"
          id="clearEvalDataBtn"
          class="btn btn--clear-eval-data"
          disabled
        >
          해당 반 평가 데이터 초기화
        </button>
      </section>
    </main>

    <p class="footer-hint">
      학생 화면: <a href="index.html">index.html</a>
    </p>

    <div id="imageModal" class="modal" hidden aria-hidden="true">
      <div id="imageModalBackdrop" class="modal__backdrop"></div>
      <div
        class="modal__dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="imageModalTitle"
      >
        <div class="modal__head">
          <h2 id="imageModalTitle" class="modal__title">작품 미리보기</h2>
          <button
            type="button"
            id="imageModalCloseBtn"
            class="modal__close"
            aria-label="닫기"
          >
            ×
          </button>
        </div>
        <div class="modal__body">
          <p
            id="imageModalLoading"
            class="modal__loading-msg"
            hidden
            aria-live="polite"
          ></p>
          <img id="imageModalImg" class="modal__img" src="" alt="" />
        </div>
      </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
